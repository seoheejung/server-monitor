---
# 기존 애플리케이션 배포 잔재 제거
- name: Remove existing application deploy directory
  # 이전 배포 잔재 때문에 app 패키지 구조가 꼬이지 않도록 app 디렉토리만 제거
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: absent

# FastAPI 애플리케이션 배치 경로 생성
- name: Create application deploy directory
  # 비워진 app 디렉토리를 다시 생성
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

# Python 3.13 바이너리 존재 여부 확인
- name: Check Python 3.13 exists
  # 시스템 기본 python3는 유지하고 별도 설치한 python3.13만 확인
  ansible.builtin.stat:
    path: "{{ python313_bin }}"
  register: python313_binary

# Python 3.13 소스 다운로드
- name: Download Python 3.13 source
  # python3.13이 없을 때만 소스를 다운로드
  ansible.builtin.get_url:
    url: "https://www.python.org/ftp/python/{{ python313_version }}/Python-{{ python313_version }}.tgz"
    dest: "/usr/local/src/Python-{{ python313_version }}.tgz"
    mode: "0644"
  when: not python313_binary.stat.exists

# Python 3.13 소스 압축 해제
- name: Extract Python 3.13 source
  # 다운로드한 tgz를 빌드 디렉토리에 압축 해제
  ansible.builtin.unarchive:
    src: "/usr/local/src/Python-{{ python313_version }}.tgz"
    dest: /usr/local/src/
    remote_src: true
  when: not python313_binary.stat.exists

# Python 3.13 configure
- name: Configure Python 3.13 build
  # 소스 configure 실행
  ansible.builtin.command:
    argv:
      - ./configure
      - --enable-optimizations
    chdir: "/usr/local/src/Python-{{ python313_version }}"
  when: not python313_binary.stat.exists

# Python 3.13 make
- name: Build Python 3.13
  # 컴파일 수행
  ansible.builtin.command:
    argv:
      - make
      - -j2
    chdir: "/usr/local/src/Python-{{ python313_version }}"
  when: not python313_binary.stat.exists

# Python 3.13 altinstall
- name: Install Python 3.13 with altinstall
  # 시스템 python 교체 없이 python3.13만 추가 설치
  ansible.builtin.command:
    argv:
      - make
      - altinstall
    chdir: "/usr/local/src/Python-{{ python313_version }}"
  when: not python313_binary.stat.exists

# 기존 venv 존재 여부 확인
- name: Check existing virtualenv python
  # 기존 venv가 있으면 python 버전을 확인
  ansible.builtin.command:
    argv:
      - "{{ venv_path }}/bin/python"
      - --version
  register: existing_venv_python
  changed_when: false
  failed_when: false

# 기존 venv 제거
- name: Remove existing virtualenv when version is not Python 3.13
  # venv가 없거나 다른 버전이면 새로 만들기 위해 제거
  ansible.builtin.file:
    path: "{{ venv_path }}"
    state: absent
  when:
    - existing_venv_python.rc != 0
      or "Python 3.13" not in existing_venv_python.stdout
      and "Python 3.13" not in existing_venv_python.stderr

# 애플리케이션 코드 배치
- name: Copy application source
  # web 전체를 복사해서 app 패키지 구조를 유지
  ansible.builtin.copy:
    src: /home/rockylinux/server-monitor/web/
    dest: "{{ app_root }}/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: preserve
    remote_src: true
  notify: Restart server-monitor

# 환경 변수 파일 배치
- name: Deploy environment file
  # 애플리케이션 실행용 환경 변수 파일 배치
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ env_file }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  notify: Restart server-monitor

# requirements 설치
- name: Install Python requirements
  become: true
  become_user: "{{ app_user }}"
  # Python 3.13 기반 venv를 생성하고 requirements를 설치
  ansible.builtin.pip:
    requirements: /home/rockylinux/server-monitor/web/requirements.txt
    virtualenv: "{{ venv_path }}"
    virtualenv_command: "{{ python313_bin }} -m venv"
    state: present
  notify: Restart server-monitor

# systemd 서비스 파일 배치
- name: Deploy systemd service
  # server-monitor systemd unit 파일 배치
  ansible.builtin.template:
    src: server-monitor.service.j2
    dest: "/etc/systemd/system/{{ service_name }}.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart server-monitor

# 검증 전에 systemd reload / 서비스 restart를 먼저 반영
- name: Apply pending handlers before verification
  # 최신 코드와 최신 systemd 설정 기준으로 검증하도록 핸들러를 먼저 실행
  ansible.builtin.meta: flush_handlers

# 서비스 자동 시작 등록 + 실행 보장
- name: Ensure service is enabled and started
  # 부팅 시 자동 시작 + 현재 실행 상태 보장
  ansible.builtin.systemd:
    name: "{{ service_name }}"
    enabled: true
    state: started
    daemon_reload: true

# systemd 유닛 파일 존재 확인
- name: Check systemd unit file exists
  # unit 파일이 실제로 생성되었는지 확인
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ service_name }}.service"
  register: systemd_unit_file

# 유닛 파일 검증
- name: Assert systemd unit file exists
  # unit 파일 누락 시 즉시 실패
  ansible.builtin.assert:
    that:
      - systemd_unit_file.stat.exists
    fail_msg: "systemd unit file was not created."
    success_msg: "systemd unit file exists."

# 서비스 enable 상태 확인
- name: Check service is enabled
  # systemd enable 상태 확인
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - "{{ service_name }}"
  register: service_enabled_result
  changed_when: false

# 서비스 enable 검증
- name: Assert service is enabled
  # 부팅 시 자동 시작 등록 여부 검증
  ansible.builtin.assert:
    that:
      - service_enabled_result.stdout | trim == "enabled"
    fail_msg: "service is not enabled."
    success_msg: "service is enabled."

# 서비스 active 상태 확인
- name: Check service is active
  # 서비스 시작 직후 activating 상태일 수 있으므로 active가 될 때까지 재시도
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ service_name }}"
  register: service_active_result
  changed_when: false
  failed_when: false
  retries: 10
  delay: 3
  until: service_active_result.stdout | trim == "active"

# 서비스 active 최종 검증
- name: Assert service is active
  # 최종적으로 active 상태가 아니면 실패
  ansible.builtin.assert:
    that:
      - service_active_result.stdout | trim == "active"
    fail_msg: "service is not active. current state={{ service_active_result.stdout | trim }}"
    success_msg: "service is active."