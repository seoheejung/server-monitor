---
# FastAPI 애플리케이션 배치 경로 생성
- name: Create application deploy directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

# 애플리케이션 코드 배치
- name: Copy application source
  ansible.builtin.copy:
    src: /home/rockylinux/server-monitor/web/app/
    dest: "{{ app_dir }}/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: preserve
    remote_src: true
  notify: Restart server-monitor

# run.py 배치
- name: Copy run.py
  ansible.builtin.copy:
    src: /home/rockylinux/server-monitor/web/run.py
    dest: "{{ app_root }}/run.py"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
    remote_src: true
  notify: Restart server-monitor

# requirements 설치
- name: Install Python requirements
  ansible.builtin.pip:
    requirements: /home/rockylinux/server-monitor/web/requirements.txt
    virtualenv: "{{ venv_path }}"
    virtualenv_python: python3
    state: present
  notify: Restart server-monitor

# 환경 변수 파일 배치
- name: Deploy environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ env_file }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"
  notify: Restart server-monitor

# systemd 서비스 파일 배치
- name: Deploy systemd service
  ansible.builtin.template:
    src: server-monitor.service.j2
    dest: "/etc/systemd/system/{{ service_name }}.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart server-monitor

# 검증 전에 systemd reload / 서비스 restart를 먼저 반영
- name: Apply pending handlers before verification
  ansible.builtin.meta: flush_handlers

# 서비스 자동 시작 등록 + 실행 보장
- name: Ensure service is enabled and started
  ansible.builtin.systemd:
    name: "{{ service_name }}"
    enabled: true
    state: started
    daemon_reload: true

# systemd 유닛 파일 존재 확인
- name: Check systemd unit file exists
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ service_name }}.service"
  register: systemd_unit_file

# 유닛 파일 검증
- name: Assert systemd unit file exists
  ansible.builtin.assert:
    that:
      - systemd_unit_file.stat.exists
    fail_msg: "systemd unit file was not created."
    success_msg: "systemd unit file exists."

# 서비스 enable 상태 확인
- name: Check service is enabled
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - "{{ service_name }}"
  register: service_enabled_result
  changed_when: false

# 서비스 enable 검증
- name: Assert service is enabled
  ansible.builtin.assert:
    that:
      - service_enabled_result.stdout | trim == "enabled"
    fail_msg: "service is not enabled."
    success_msg: "service is enabled."

# 서비스 active 상태 확인
- name: Check service is active
  # 서비스 시작 직후 activating 상태일 수 있으므로 active가 될 때까지 재시도
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ service_name }}"
  register: service_active_result
  changed_when: false
  failed_when: false
  retries: 10
  delay: 3
  until: service_active_result.stdout | trim == "active"

# 서비스 active 최종 검증
- name: Assert service is active
  ansible.builtin.assert:
    that:
      - service_active_result.stdout | trim == "active"
    fail_msg: "service is not active. current state={{ service_active_result.stdout | trim }}"
    success_msg: "service is active."