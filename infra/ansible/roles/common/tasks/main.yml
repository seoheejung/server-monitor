---
# 이 role이 실제로 수행하는 작업 목록

- name: Install basic packages (Linux)
  dnf:
    name: "{{ common_packages }}"
    state: present

# firewalld 설정 추가
- name: Ensure firewalld is running
  service:
    name: firewalld
    state: started
    enabled: true

- name: Open SSH port
  firewalld:
    service: ssh
    permanent: true
    state: enabled
  notify: Reload firewalld

# Python venv
- name: Create application directory
  file: 
    path: /opt/server-monitor
    state: directory
    owner: server-monitor
    group: server-monitor
    mode: '0755'

- name: Create virtualenv
  command: python3 -m venv /opt/server-monitor/venv
  args:
    creates: /opt/server-monitor/venv/bin/activate # 해당 파일이 있으면 다시 실행 안 함