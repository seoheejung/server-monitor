---
- name: Install basic packages (Linux)
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present

# firewalld 설치 보장
- name: Install firewalld
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Ensure firewalld is running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Open SSH port
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    state: enabled
    immediate: true
  notify: Reload firewalld

# Python venv
- name: Create application directory
  ansible.builtin.file:
    path: /opt/server-monitor
    state: directory
    owner: server-monitor
    group: server-monitor
    mode: '0755'

- name: Create virtualenv
  ansible.builtin.command:
    cmd: python3 -m venv /opt/server-monitor/venv
    creates: /opt/server-monitor/venv/bin/activate