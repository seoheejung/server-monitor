---
- name: Add MongoDB repository
  # Rocky Linux 기본 repo에는 mongodb-org가 없어서 공식 repo를 등록
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/mongodb-org.repo
    mode: "0644"
    content: |
      [mongodb-org-7.0]
      name=MongoDB Repository
      baseurl=https://repo.mongodb.org/yum/redhat/$releasever/mongodb-org/7.0/x86_64/
      gpgcheck=1
      enabled=1
      gpgkey=https://pgp.mongodb.com/server-7.0.asc

- name: Install MongoDB packages
  # mongod, mongosh 포함 메타 패키지 설치
  ansible.builtin.dnf:
    name: mongodb-org
    state: present

- name: Deploy mongod.conf
  # 인증 활성화 여부는 템플릿 변수로 제어
  ansible.builtin.template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mongod

- name: Apply mongod restart immediately when config changed
  # 이후 사용자 생성/검사가 최신 설정 기준으로 동작하도록 즉시 반영
  ansible.builtin.meta: flush_handlers

- name: Ensure mongod is enabled and started
  # 부팅 시 자동 시작 + 현재 실행 상태 보장
  ansible.builtin.systemd:
    name: mongod
    enabled: true
    state: started

- name: Wait for MongoDB port
  # MongoDB가 실제로 포트 바인딩 끝낼 때까지 대기
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 27017
    timeout: 30

- name: Check admin authentication
  # 재실행 상태에서는 vault 값으로 바로 인증되는지 먼저 확인
  ansible.builtin.command:
    argv:
      - mongosh
      - --host
      - 127.0.0.1
      - --port
      - "27017"
      - --quiet
      - --username
      - "{{ mongodb_admin_username }}"
      - --password
      - "{{ mongodb_admin_password }}"
      - --authenticationDatabase
      - admin
      - --eval
      - 'db.runCommand({ connectionStatus: 1 }).ok'
  register: mongodb_admin_auth_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Check admin user exists without auth
  # auth 실패 시에만 localhost 기준으로 bootstrap 가능 여부 확인
  ansible.builtin.command:
    argv:
      - mongosh
      - --host
      - 127.0.0.1
      - --port
      - "27017"
      - --quiet
      - --eval
      - 'db.getSiblingDB("admin").getUser("{{ mongodb_admin_username }}") ? "exists" : "missing"'
  register: mongodb_admin_user_check_noauth
  changed_when: false
  failed_when: false
  when: mongodb_admin_auth_check.rc != 0

- name: Create admin user
  # admin 사용자가 하나도 없는 최초 상태에서만 vault 값으로 자동 생성
  ansible.builtin.command:
    argv:
      - mongosh
      - --host
      - 127.0.0.1
      - --port
      - "27017"
      - --quiet
      - --eval
      - >-
        db.getSiblingDB("admin").createUser({
          user: "{{ mongodb_admin_username }}",
          pwd: "{{ mongodb_admin_password }}",
          roles: [
            { role: "root", db: "admin" }
          ]
        })
  when:
    - mongodb_admin_auth_check.rc != 0
    - mongodb_admin_user_check_noauth.stdout | trim == "missing"
    - "'not authorized' not in mongodb_admin_user_check_noauth.stderr"
  changed_when: true
  no_log: true

- name: Re-check admin authentication after bootstrap
  # 최초 생성 직후에는 동일한 vault 값으로 인증이 실제 성공하는지 재검증
  ansible.builtin.command:
    argv:
      - mongosh
      - --host
      - 127.0.0.1
      - --port
      - "27017"
      - --quiet
      - --username
      - "{{ mongodb_admin_username }}"
      - --password
      - "{{ mongodb_admin_password }}"
      - --authenticationDatabase
      - admin
      - --eval
      - 'db.runCommand({ connectionStatus: 1 }).ok'
  register: mongodb_admin_auth_check_after_bootstrap
  changed_when: false
  failed_when: false
  when:
    - mongodb_admin_auth_check.rc != 0
    - mongodb_admin_user_check_noauth.stdout | trim == "missing"
    - "'not authorized' not in mongodb_admin_user_check_noauth.stderr"
  no_log: true

- name: Fail when existing admin credentials do not match vault values
  # admin 사용자는 이미 있는데 vault 값이 틀린 경우 자동 생성이 아니라 명확히 실패해야 함
  ansible.builtin.fail:
    msg: >-
      MongoDB admin user already exists, but the credentials in vault.yml do not match.
      Check mongodb_admin_username and mongodb_admin_password.
  when:
    - mongodb_admin_auth_check.rc != 0
    - mongodb_admin_user_check_noauth is defined
    - mongodb_admin_user_check_noauth.stdout | trim != "missing"
      or "'not authorized' in mongodb_admin_user_check_noauth.stderr"

- name: Set admin auth success flag
  # 이후 app user 작업에서 사용할 최종 인증 성공 여부 정리
  ansible.builtin.set_fact:
    mongodb_admin_auth_ok: >-
      {{
        (mongodb_admin_auth_check.rc == 0)
        or
        (
          mongodb_admin_auth_check_after_bootstrap is defined
          and mongodb_admin_auth_check_after_bootstrap.rc == 0
        )
      }}

- name: Fail if admin authentication is still not available
  # bootstrap 후에도 인증이 안 되면 더 진행하지 않음
  ansible.builtin.fail:
    msg: >-
      MongoDB admin authentication is still failing after bootstrap.
      Check mongod.conf auth settings and vault credentials.
  when: not mongodb_admin_auth_ok

- name: Check app user exists
  # 앱 계정 존재 여부는 관리자 인증 후 확인
  ansible.builtin.command:
    argv:
      - mongosh
      - --host
      - 127.0.0.1
      - --port
      - "27017"
      - --quiet
      - --username
      - "{{ mongodb_admin_username }}"
      - --password
      - "{{ mongodb_admin_password }}"
      - --authenticationDatabase
      - admin
      - --eval
      - 'db.getSiblingDB("{{ mongodb_app_database }}").getUser("{{ mongodb_app_username }}") ? "exists" : "missing"'
  register: mongodb_app_user_check
  changed_when: false
  no_log: true

- name: Create app user
  # 앱은 관리자 계정이 아니라 전용 DB 계정으로만 접근
  ansible.builtin.command:
    argv:
      - mongosh
      - --host
      - 127.0.0.1
      - --port
      - "27017"
      - --quiet
      - --username
      - "{{ mongodb_admin_username }}"
      - --password
      - "{{ mongodb_admin_password }}"
      - --authenticationDatabase
      - admin
      - --eval
      - >-
        db.getSiblingDB("{{ mongodb_app_database }}").createUser({
          user: "{{ mongodb_app_username }}",
          pwd: "{{ mongodb_app_password }}",
          roles: [
            { role: "readWrite", db: "{{ mongodb_app_database }}" }
          ]
        })
  when: mongodb_app_user_check.stdout | trim == "missing"
  changed_when: true
  no_log: true