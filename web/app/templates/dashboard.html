<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Server Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💾</text></svg>">
</head>
<body>
<div class="container-header">
    <h1>SERVER MONITOR</h1>
    <div class="refresh-meta">
        <div class="refresh-info">
            <span>[LAST UPDATED] <span id="last-updated">-</span></span>
            <span id="refresh-status">[AUTO REFRESH] READY</span>
        </div>

        <div class="refresh-control">
            <label>INTERVAL</label>
            <select id="refresh-interval" onchange="changeInterval(this.value)">
                <option value="10">10s</option>
                <option value="30">30s</option>
                <option value="60" selected>60s</option>
            </select>
        </div>
    </div>
</div>
<div class="container-body">
    <!-- 시스템 상태 -->
    <div class="container-row">
        <div class="card">
            <p>CPU :
                <span id="cpu" class="">-</span>
            </p>
            <p>MEMORY :
                <span id="memory" class="">-</span>
            </p>
            <p>DISK :
                <span id="disk" class="">-</span>
            </p>
            <p>UPTIME :
                <span id="uptime">-</span>
            </p>
        </div>

        <!-- 서비스 상태 -->
        <div class="card">
            <h2>SERVICES</h2>
            <div id="service-list" class="service-list">
                <div class="service-item">
                    <div class="service-name-group">
                        <span class="dot"></span>
                        <span class="service-name">LOADING...</span>
                    </div>
                    <span class="service-status">[ WAIT ]</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 로그 콘솔 -->
    <div class="container-row">
        <div class="card log-card">
            <h2>LOG CONSOLE</h2>
            <p id="log-source" style="font-size:9px; color:#999; margin-bottom: 15px;">
                SOURCE : -
            </p>
            <div id="log-console" class="console">
                <div class="log-line">AUTHENTICATION REQUIRED</div>
            </div>
        </div>

        <!-- 프로세스 상태 -->
        <div class="card process-card">
            <h2>PROCESSES</h2>
            <div id="process-list">
                <p class="process-status">
                    <span class="dot"></span>
                    WAITING FOR AUTHENTICATION...
                </p>
            </div>
        </div>
    </div>
</div>

<div id="custom-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
        <h2 id="modal-title">SYSTEM MESSAGE</h2>
        <p id="modal-message"></p>
        <div class="modal-buttons">
            <button id="modal-cancel-btn" class="kill-btn" style="color: #eee; border-color: #eee;">CANCEL</button>
            <button id="modal-ok-btn" class="kill-btn">CONFIRM</button>
        </div>
    </div>
</div>
<script src="/static/dashboard.js"></script>
</body>
</html>
